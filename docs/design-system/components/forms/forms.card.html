<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-sans); color: var(--text-strong); }
  #root { padding: 22px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px 28px; align-items: start; }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const NS = window.JobApplicationAgentDesignSystem_8adca7;
  const { SegmentedControl, TextField, TextArea, UploadZone, CollapsiblePreview } = NS;
  function Demo() {
    const [mode, setMode] = React.useState('url');
    return (
      <>
        <div>
          <div className="lbl">Segmented · Text field</div>
          <SegmentedControl value={mode} onChange={setMode}
            options={[{value:'url',label:'Job URL',icon:'link'},{value:'paste',label:'Paste text',icon:'file-text'}]} />
          <div style={{height:14}} />
          <TextField label="Job posting URL" icon="link" defaultValue="https://careers.acme.com/staff-eng" />
          <div style={{height:14}} />
          <TextField label="Unreachable URL" icon="link" defaultValue="intranet/posting"
            error="That URL was unreachable. Paste the text instead." />
        </div>
        <div>
          <div className="lbl">Upload · Selected file</div>
          <UploadZone />
          <div style={{height:12}} />
          <UploadZone file={{ name: 'jane-doe-cv.pdf', size: '142 KB' }} />
        </div>
        <div>
          <div className="lbl">Textarea</div>
          <TextArea label="Paste your CV" count defaultValue={"Jane Doe — Staff Engineer\nLed platform reliability for a 40-person org…"} />
        </div>
        <div>
          <div className="lbl">Parse preview</div>
          <CollapsiblePreview title="CV — extracted text" defaultOpen confirmedLabel="Parsed"
            text={"JANE DOE\nStaff Software Engineer · Berlin\n\nSummary — Reliability-focused engineer with 9 years building distributed systems. Cut p99 latency 38% across the payments platform and mentored six engineers to senior."} />
          <div style={{height:10}} />
          <UploadZone error="That file is over 5 MB." />
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
