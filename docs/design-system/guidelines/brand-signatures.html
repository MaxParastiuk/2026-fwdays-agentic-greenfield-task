<!-- @dsCard group="Brand" viewport="700x176" subtitle="Privacy line, eyebrow label, and the action button" name="Brand signatures" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-sans); color: var(--text-strong); }
  .wrap { padding: 24px 26px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
  .btn { font-family: var(--font-sans); font-size: 14px; font-weight: 600; color: var(--action-text); background: var(--action-bg); border: none; border-radius: var(--radius-md); padding: 11px 20px; cursor: pointer; }
  .privacy { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
  .privacy svg { flex: none; }
  .row { display: flex; gap: 18px; align-items: center; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">No accounts · No stored data · No cookies</div>
    <div class="row">
      <button class="btn">Generate cover letter</button>
      <div class="privacy">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B665B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Your CV never touches our disk.
      </div>
    </div>
  </div>
</body>
</html>
