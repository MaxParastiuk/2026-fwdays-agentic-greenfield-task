<!-- @dsCard group="Spacing" viewport="700x150" subtitle="4px base grid, 4 → 96px" name="Spacing scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-sans); color: var(--text-strong); }
  .wrap { padding: 22px 26px; display: flex; align-items: flex-end; gap: 14px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .bar { width: 18px; background: var(--accent-700); border-radius: 3px; }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="bar" style="height:8px"></div><div class="lab">2</div></div>
    <div class="col"><div class="bar" style="height:12px"></div><div class="lab">3</div></div>
    <div class="col"><div class="bar" style="height:16px"></div><div class="lab">4</div></div>
    <div class="col"><div class="bar" style="height:24px"></div><div class="lab">6</div></div>
    <div class="col"><div class="bar" style="height:32px"></div><div class="lab">8</div></div>
    <div class="col"><div class="bar" style="height:48px"></div><div class="lab">12</div></div>
    <div class="col"><div class="bar" style="height:64px"></div><div class="lab">16</div></div>
    <div class="col"><div class="bar" style="height:80px"></div><div class="lab">20</div></div>
  </div>
</body>
</html>
