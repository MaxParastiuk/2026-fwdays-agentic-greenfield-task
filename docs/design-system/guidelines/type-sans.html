<!-- @dsCard group="Type" viewport="700x208" subtitle="Public Sans — all interface chrome" name="Sans — Public Sans" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-sans); color: var(--text-strong); }
  .wrap { padding: 22px 26px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
  .h { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; margin-top: 8px; }
  .body { font-size: 15px; font-weight: 400; color: var(--text-body); margin-top: 8px; line-height: 1.5; max-width: 540px; }
  .weights { display: flex; gap: 18px; margin-top: 14px; font-size: 15px; }
  .weights span { color: var(--text-body); }
  .meta { font-size: 10.5px; color: var(--text-faint); margin-top: 12px; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Pipeline status</div>
    <div class="h">Generate cover letter</div>
    <div class="body">Upload a CV and provide the job posting. Nothing runs until both inputs pass validation.</div>
    <div class="weights">
      <span style="font-weight:400">Regular</span>
      <span style="font-weight:500">Medium</span>
      <span style="font-weight:600">Semibold</span>
      <span style="font-weight:700">Bold</span>
    </div>
    <div class="meta">PUBLIC SANS · 400 / 500 / 600 / 700</div>
  </div>
</body>
</html>
