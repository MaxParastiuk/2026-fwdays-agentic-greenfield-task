<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Corner radii — document-moderate, never pill UI" name="Radii" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-sans); color: var(--text-strong); }
  .wrap { padding: 22px 26px; display: flex; gap: 18px; align-items: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 62px; height: 62px; background: var(--surface); border: 1.5px solid var(--accent-700); }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
  .pill { width: 78px; height: 34px; display: flex; align-items: center; justify-content: center; background: var(--accent-100); border-radius: 999px; font-size: 11px; color: var(--accent-700); font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="box" style="border-radius:3px"></div><div class="lab">xs · 3</div></div>
    <div class="col"><div class="box" style="border-radius:5px"></div><div class="lab">sm · 5</div></div>
    <div class="col"><div class="box" style="border-radius:8px"></div><div class="lab">md · 8</div></div>
    <div class="col"><div class="box" style="border-radius:12px"></div><div class="lab">lg · 12</div></div>
    <div class="col"><div class="box" style="border-radius:16px"></div><div class="lab">xl · 16</div></div>
    <div class="col"><div class="pill">badge</div><div class="lab">full</div></div>
  </div>
</body>
</html>
