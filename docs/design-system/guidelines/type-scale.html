<!-- @dsCard group="Type" viewport="700x250" subtitle="Modular scale, 11 → 60px" name="Type scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-sans); color: var(--text-strong); }
  .wrap { padding: 18px 26px; }
  .r { display: flex; align-items: baseline; gap: 16px; padding: 3px 0; }
  .tag { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); width: 96px; flex: none; }
  .ex { line-height: 1.15; letter-spacing: -0.01em; white-space: nowrap; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="r"><span class="tag">5xl · 60</span><span class="ex" style="font-family:var(--font-serif);font-weight:500;font-size:38px">Considered</span></div>
    <div class="r"><span class="tag">3xl · 36</span><span class="ex" style="font-family:var(--font-serif);font-weight:500;font-size:30px">A letter worth signing</span></div>
    <div class="r"><span class="tag">2xl · 28</span><span class="ex" style="font-weight:700;font-size:24px">Generate cover letter</span></div>
    <div class="r"><span class="tag">xl · 22</span><span class="ex" style="font-weight:600;font-size:20px">Iteration timeline</span></div>
    <div class="r"><span class="tag">md · 16</span><span class="ex" style="font-family:var(--font-serif);font-size:16px">The rendered cover-letter body.</span></div>
    <div class="r"><span class="tag">base · 15</span><span class="ex" style="font-size:15px">Body interface text and inputs.</span></div>
    <div class="r"><span class="tag">xs · 12</span><span class="ex" style="font-size:12px;color:var(--text-muted)">Captions, badges, and helper text.</span></div>
  </div>
</body>
</html>
