<!-- @dsCard group="Colors" viewport="700x176" subtitle="Warm paper-to-ink neutral ramp" name="Neutrals — paper & ink" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-ui); color: var(--text-strong); }
  .wrap { padding: 22px 24px; }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-md); border: 1px solid var(--border-soft); }
  .name { font-size: 11px; font-weight: 600; margin-top: 8px; letter-spacing: .01em; }
  .hex { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw"><div class="chip" style="background:#FAF8F4"></div><div class="name">paper</div><div class="hex">#FAF8F4</div></div>
      <div class="sw"><div class="chip" style="background:#F2EFE8"></div><div class="name">paper-deep</div><div class="hex">#F2EFE8</div></div>
      <div class="sw"><div class="chip" style="background:#D8D2C6"></div><div class="name">ink-200</div><div class="hex">#D8D2C6</div></div>
      <div class="sw"><div class="chip" style="background:#B0A99B"></div><div class="name">ink-300</div><div class="hex">#B0A99B</div></div>
      <div class="sw"><div class="chip" style="background:#6B665B"></div><div class="name">ink-500</div><div class="hex">#6B665B</div></div>
      <div class="sw"><div class="chip" style="background:#3D3A33"></div><div class="name">ink-700</div><div class="hex">#3D3A33</div></div>
      <div class="sw"><div class="chip" style="background:#1A1815"></div><div class="name">ink-900</div><div class="hex">#1A1815</div></div>
    </div>
  </div>
</body>
</html>
