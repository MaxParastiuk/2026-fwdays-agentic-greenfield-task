<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-mono); color: var(--text-strong); }

  .k { color: var(--accent-500); }
  .pass { color: var(--pass); font-weight: 600; }
  .muted { color: var(--text-faint); }
  .meta { font-family: var(--font-sans); font-size: 10.5px; color: var(--text-faint); margin-top: 12px; letter-spacing: .04em; }
</style>
</head>
<body>

    <div class="line muted">{ "ts": 1719…, "iterations": 3, "score": 8.6, "ms": 4120 }</div>
    <div class="meta">JETBRAINS MONO · 400 / 500 / 600 · TABULAR FIGURES</div>

</html>
