<!-- @dsCard group="Colors" viewport="700x176" subtitle="Deep navy-ink — the single action color" name="Accent — navy ink" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-ui); color: var(--text-strong); }
  .wrap { padding: 22px 24px; }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-md); border: 1px solid var(--border-soft); }
  .name { font-size: 11px; font-weight: 600; margin-top: 8px; }
  .hex { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }
  .role { font-size: 10px; color: var(--text-faint); margin-top: 1px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw"><div class="chip" style="background:#F1F4F9"></div><div class="name">accent-050</div><div class="hex">#F1F4F9</div></div>
      <div class="sw"><div class="chip" style="background:#E7EDF4"></div><div class="name">accent-100</div><div class="hex">#E7EDF4</div></div>
      <div class="sw"><div class="chip" style="background:#9FB4CC"></div><div class="name">accent-300</div><div class="hex">#9FB4CC</div></div>
      <div class="sw"><div class="chip" style="background:#2F5680"></div><div class="name">accent-500</div><div class="hex">#2F5680</div><div class="role">links · focus</div></div>
      <div class="sw"><div class="chip" style="background:#1E3550"></div><div class="name">accent-700</div><div class="hex">#1E3550</div><div class="role">action</div></div>
      <div class="sw"><div class="chip" style="background:#16273D"></div><div class="name">accent-900</div><div class="hex">#16273D</div><div class="role">pressed</div></div>
    </div>
  </div>
</body>
</html>
