<!-- @dsCard group="Type" viewport="700x200" subtitle="Newsreader — display titles & the cover letter" name="Serif — Newsreader" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-serif); color: var(--text-strong); }
  .wrap { padding: 22px 26px; }
  .big { font-size: 44px; font-weight: 500; line-height: 1.05; letter-spacing: -0.02em; }
  .sub { font-size: 18px; font-weight: 400; color: var(--text-body); margin-top: 10px; line-height: 1.5; max-width: 560px; }
  .ital { font-style: italic; color: var(--text-muted); }
  .meta { font-family: var(--font-ui); font-size: 10.5px; color: var(--text-faint); margin-top: 14px; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="big">A letter worth signing.</div>
    <div class="sub">The Maker writes, the Checker scores, and the loop repeats — <span class="ital">until the words fit the role.</span></div>
    <div class="meta">NEWSREADER · 400 / 500 / 600 · ROMAN + ITALIC</div>
  </div>
</body>
</html>
